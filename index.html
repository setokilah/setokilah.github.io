
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171615">
<meta name="description" content="Seto Killah — rapero, tatuador y artista independiente.">
<title>SETO KILLAH | 4TA FAM</title>

<style>
:root {
  --dark: #171615;
  --panel: rgba(20, 19, 18, .88);
  --cream: #eee7dc;
  --muted: #b9afa3;
  --green: #25D366;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--cream);
  background-color: #292725;
  background-image:
    linear-gradient(rgba(12,11,10,.68), rgba(12,11,10,.80)),
    url("https://images.unsplash.com/photo-1759919047748-b26bf01ea6cf?auto=format&fit=crop&fm=jpg&q=80&w=1800");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("logo.png") center center / min(75vw, 520px) auto no-repeat;
  opacity: .08;
  pointer-events: none;
  z-index: 0;
}

main {
  position: relative;
  z-index: 1;
  width: min(100% - 30px, 470px);
  margin: auto;
  padding: 35px 0 45px;
}

.panel {
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 25px 20px;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  box-shadow: 0 15px 45px rgba(0,0,0,.4);
}

.brand {
  text-align: center;
  margin-bottom: 24px;
}

.brand h1 {
  font-size: clamp(29px, 8vw, 42px);
  letter-spacing: 2px;
  margin: 0;
  font-weight: 900;
}

.brand p {
  color: var(--cream);
  letter-spacing: 4px;
  font-size: 15px;
  font-weight: bold;
  margin: 12px 0 0;
}

.photos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
  margin: 22px 0;
}

.photos img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 3px solid rgba(238,231,220,.75);
  display: block;
}

.bio {
  text-align: center;
  margin: 18px 0 25px;
}

.bio h2 {
  font-size: 15px;
  letter-spacing: 2px;
  margin-bottom: 7px;
}

.bio p {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
  margin: 0;
}

.section-title {
  text-align: center;
  font-size: 13px;
  letter-spacing: 3px;
  margin: 25px 0 15px;
}

.socials {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
}

.social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 60px;
  padding: 10px;
  border-radius: 15px;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.13);
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
  transition: background .2s, transform .2s;
}

.social:hover {
  background: rgba(255,255,255,.17);
  transform: translateY(-2px);
}

.social img {
  width: 25px;
  height: 25px;
  flex-shrink: 0;
}

.contact {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 64px;
  padding: 15px;
  border-radius: 35px;
  margin-top: 13px;
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
  transition: filter .2s;
}

.contact:hover {
  filter: brightness(1.08);
}

.contact img {
  width: 23px;
  height: 23px;
}

.whatsapp {
  color: white;
  background: var(--green);
}

.email {
  color: var(--cream);
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.13);
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 25px;
}

@media (max-width: 360px) {
  main {
    width: min(100% - 20px, 470px);
  }

  .panel {
    padding: 20px 14px;
  }

  .social {
    font-size: 12px;
    gap: 7px;
  }

  .photos {
    gap: 9px;
  }
}

@media (max-width: 600px) {
  body {
    background-attachment: scroll;
  }
}
</style>
</head>

<body>
<main>
  <div class="panel">

    <header class="brand">

      <a class="social"

    <a class="contact whatsapp"

    <a class="contact email"
       href="mailto:seto4tafamilia@gmail.com">
      <span aria-hidden="true">✉</span>
      <span>CONTACTO POR CORREO</span>
    </a>

  </div>

  <footer>SETO KILLAH · 4TA FAM</footer>
</main>
</body>
</html>
